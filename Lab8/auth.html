<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация / Вход - Rayal Park</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gelasio:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>

    .btn-submit:disabled {
    background: #cccccc;
    cursor: not-allowed;
    opacity: 0.6;
}

.btn-submit:disabled:hover {
    background: #cccccc;
    transform: none;
}

        .auth-page .main-banner {
            height: auto;
            min-height: auto;
            background-image: none;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-bottom: none;
        }
        
        .auth-container {
            max-width: 500px;
            margin: 50px auto;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .auth-tabs {
            display: flex;
            border-bottom: 1px solid #E0E0E0;
        }
        
        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 18px;
            font-family: 'Gelasio', serif;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            background: #f8f9fa;
            color: #6E7A8A;
            border: none;
            transition: all 0.3s;
        }
        
        .auth-tab.active {
            background: #fff;
            color: #1B75BB;
            border-bottom: 3px solid #1B75BB;
        }
        
        .auth-form {
            padding: 40px;
            display: none;
        }
        
        .auth-form.active {
            display: block;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #081F32;
            margin-bottom: 8px;
        }
        
        .form-group label.required::after {
            content: '*';
            color: #ff4444;
            margin-left: 4px;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #E0E0E0;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Roboto', sans-serif;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #1B75BB;
        }
        
        .form-group input.error {
            border-color: #ff4444;
        }
        
        .error-message {
            color: #ff4444;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .password-option {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .password-option label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        
        .generate-nickname {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .generate-nickname input {
            flex: 1;
        }
        
        .btn-generate {
            background: #f0f0f0;
            border: 1px solid #E0E0E0;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
        }
        
        .btn-generate:hover {
            background: #e0e0e0;
        }
        
        .agreement {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }
        
        .agreement input {
            width: auto;
        }
        
        .btn-submit {
            width: 100%;
            background: #1B75BB;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .btn-submit:hover:not(:disabled) {
            background: #0d5a94;
        }
        
        .nickname-status {
            font-size: 12px;
            margin-top: 5px;
        }
        
        .nickname-status.error {
            color: #ff4444;
        }
        
        .nickname-status.success {
            color: #4CAF50;
        }
        
        @media (max-width: 576px) {
            .auth-form {
                padding: 25px;
            }
            .form-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            .generate-nickname {
                flex-direction: column;
            }
            .btn-generate {
                width: 100%;
            }
        }
    </style>
</head>
<body class="auth-page">
    <div class="main-banner">
        <div class="container">
            <header>
                <div class="logo">
                    <img src="logo/logo.svg" alt="Royal Park icon" class="logo-icon">
                    <span class="logo-text">Rayal Park</span>
                </div>
                <div class="burger-menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <nav>
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="catalog.html">Catalog</a></li>
                        <li><a href="favorites.html">Favorites <span id="fav-count">(0)</span></a></li>
                        <li><a href="cart.html">Cart <span id="cart-count">(0)</span></a></li>
                        <li><a href="auth.html" class="active">Account</a></li>
                    </ul>
                </nav>
                <a class="btn" href="#">Book now</a>
            </header>
        </div>
    </div>

    <main>
        <div class="container">
            <div class="auth-container">
                <div class="auth-tabs">
                    <button class="auth-tab active" data-tab="login">Вход</button>
                    <button class="auth-tab" data-tab="register">Регистрация</button>
                </div>

                <div class="auth-form active" id="login-form">
                    <div class="form-group">
                        <label class="required">Email</label>
                        <input type="email" id="login-email" placeholder="example@mail.com">
                        <div class="error-message" id="login-email-error"></div>
                    </div>
                    <div class="form-group">
                        <label class="required">Пароль</label>
                        <input type="password" id="login-password" placeholder="Введите пароль">
                        <div class="error-message" id="login-password-error"></div>
                    </div>
                    <button class="btn-submit" id="login-submit">Войти</button>
                </div>

<div class="auth-form" id="register-form">
    <div class="form-row">
        <div class="form-group">
            <label class="required">Имя</label>
            <input type="text" id="reg-firstname" placeholder="Иван">
            <div class="error-message" id="reg-firstname-error"></div>
        </div>
        <div class="form-group">
            <label>Отчество</label>
            <input type="text" id="reg-middlename" placeholder="Иванович">
            <div class="error-message" id="reg-middlename-error"></div>
        </div>
    </div>
    <div class="form-group">
        <label class="required">Фамилия</label>
        <input type="text" id="reg-lastname" placeholder="Петров">
        <div class="error-message" id="reg-lastname-error"></div>
    </div>
    
    <div class="form-group">
        <label class="required">Телефон (+375)</label>
        <input type="tel" id="reg-phone" placeholder="+375291234567">
        <div class="error-message" id="reg-phone-error"></div>
    </div>
    
    <div class="form-group">
        <label class="required">Email</label>
        <input type="email" id="reg-email" placeholder="example@mail.com">
        <div class="error-message" id="reg-email-error"></div>
    </div>
    
    <div class="form-group">
        <label class="required">Дата рождения</label>
        <input type="date" id="reg-birthdate">
        <div class="error-message" id="reg-birthdate-error"></div>
    </div>
    
    <div class="password-option">
        <label>
            <input type="radio" name="password-option" value="manual" checked> Ввести пароль самостоятельно
        </label>
        <label>
            <input type="radio" name="password-option" value="auto"> Сгенерировать пароль
        </label>
    </div>
    
    <div id="manual-password-group">
        <div class="form-group">
            <label class="required">Пароль</label>
            <input type="password" id="reg-password" placeholder="Минимум 8 символов">
            <div class="error-message" id="reg-password-error"></div>
        </div>
        <div class="form-group">
            <label class="required">Подтверждение пароля</label>
            <input type="password" id="reg-password-confirm" placeholder="Повторите пароль">
            <div class="error-message" id="reg-password-confirm-error"></div>
        </div>
    </div>
    
    <div id="auto-password-group" style="display: none;">
        <div class="form-group">
            <label>Сгенерированный пароль</label>
            <input type="text" id="auto-password" readonly>
            <div class="error-message" id="auto-password-error"></div>
        </div>
    </div>
    
    <div class="form-group">
        <label class="required">Никнейм</label>
        <div class="generate-nickname">
            <input type="text" id="reg-nickname" placeholder="Ваш никнейм">
            <button type="button" class="btn-generate" id="generate-nickname">Сгенерировать</button>
        </div>
        <div class="nickname-status" id="nickname-status"></div>
    </div>
    
    <div class="agreement">
        <input type="checkbox" id="agreement">
        <label>Я принимаю <a href="#" id="show-agreement">Соглашение пользователя</a></label>
    </div>
    
    <button class="btn-submit" id="register-submit" disabled>Зарегистрироваться</button>
</div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-grid">
            <div class="footer-brand">
                <div class="footer-brand-row">
                    <img src="logo/logo.svg" alt="Rayal Park logo">
                    <h2>Rayal Park</h2>
                </div>
                <p>Travel deals on hotels, flights, vacation packages.</p>
                <span>@shovasatkhira88.com</span>
                <div class="footer-icons">
                    <img src="img/facebook.png" alt="Facebook icon">
                    <img src="img/instagramm.png" alt="Instagram icon">
                    <img src="img/twitter(2).png" alt="Twitter icon">
                    <img src="img/google.png" alt="Google icon">
                </div>
            </div>
            <div class="footer-column">
                <h3>Home</h3>
                <a href="#">Accessibility</a>
                <a href="#">Certification</a>
                <a href="#">Knowledge</a>
            </div>
            <div class="footer-column">
                <h3>Pages</h3>
                <a href="#">Blogs</a>
                <a href="#">Careers</a>
                <a href="#">Community</a>
            </div>
            <div class="footer-column">
                <h3>SUBSCRIBE</h3>
                <div class="footer-subscribe-form">
                    <input type="text" placeholder="Enter your email address">
                    <button>Subscribe</button>
                </div>
            </div>
        </div>
    </footer>

    <script src="api.js"></script>
    <script src="auth.js"></script>
</body>
</html>
